
apiVersion: apps/v1
kind: Deployment
metadata:
  name: falcon-triage-api
  namespace: security-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: falcon-triage-api
  template:
    metadata:
      labels:
        app: falcon-triage-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: crowdstrike-devsecops-lab:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 10
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: falcon-triage-api
  namespace: security-lab
spec:
  selector:
    app: falcon-triage-api
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
